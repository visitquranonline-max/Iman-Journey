name: Build Android APK (Iman Journey)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Add & Sync Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Grant Execute Permission for Gradle
        run: |
          cd android
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (Unsigned)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || echo "Release build step completed"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImanJourney-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK Artifact (If Generated)
        uses: actions/upload-artifact@v4
        with:
          name: ImanJourney-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

