<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          if (origFetch) {
            var fetchVal = origFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return fetchVal; },
              set: function(v) { fetchVal = v; },
              configurable: true,
              enumerable: true
            });
          }
        } catch(e) {
          console.warn('Fetch polyfill notice:', e);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Islamic History Adventure - Learn, Play & Discover</title>
    <meta name="description" content="Interactive 3D cartoon Islamic history stories, quizzes, and learning app by Visit Quran Online Academy." />
    <meta name="theme-color" content="#064e3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Islamic History Adventure" />
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('SW registered: ', registration.scope);
          }).catch((err) => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
